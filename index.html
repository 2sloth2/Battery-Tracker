<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f5f5f7">
    
    <link rel="manifest" href='data:application/manifest+json,%7B%22name%22%3A%22FPV%20Battery%20Cache%22%2C%22short_name%22%3A%22Battery%20Cache%22%2C%22display%22%3A%22fullscreen%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%23f5f5f7%22%2C%22theme_color%22%3A%22%23f5f5f7%22%7D'>
    
    <title>FPV Battery Cache</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #f5f5f7; 
            --surface: #ffffff; 
            --text-bold: #1d1d1f; 
            --text-light: #515154; 
            --brand: #5c0f1e; /* Deep reddish-purple brand accent */
            --primary-text: #ffffff;
            --danger: #ff3b30;
            --input-bg: #f5f5f7;
            --radius: 16px; 
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-bold); margin: 0; padding: 20px; padding-bottom: 100px; -webkit-tap-highlight-color: transparent; }
        
        /* Sci-Fi Brand Header */
        .brand-header {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 24px;
            color: var(--brand);
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h2, h3, strong { font-weight: 600; margin-top: 0; letter-spacing: -0.3px; }
        
        #scanner-view, #modal-overlay, #custom-dialog-overlay { display: none; }
        
        button { background: var(--brand); color: var(--primary-text); border: none; padding: 14px 20px; font-size: 16px; font-family: 'Inter', sans-serif; font-weight: 600; border-radius: var(--radius); cursor: pointer; width: 100%; transition: opacity 0.2s; }
        button:active { opacity: 0.7; }
        button.secondary { background: #e5e5ea; color: var(--text-bold); }
        button.danger { background: var(--danger); color: #fff; }
        
        .fab-container { position: fixed; bottom: 20px; left: 20px; right: 20px; z-index: 100; }
        .fab { background: var(--brand); color: var(--primary-text); box-shadow: 0 4px 14px rgba(0,0,0,0.15); font-size: 18px; padding: 18px; font-family: 'Orbitron', sans-serif; letter-spacing: 0.5px; }

        #reader-container { position: relative; width: 100%; border-radius: var(--radius); overflow: hidden; background: #000; margin-bottom: 20px; }
        #reader { width: 100%; }
        .scanner-hint { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; color: #fff; font-size: 14px; font-weight: 600; background: rgba(0,0,0,0.5); padding: 8px; pointer-events: none; }
        
        .battery-card { background: var(--surface); border-radius: var(--radius); margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); overflow: hidden; }
        .card-header { padding: 16px 16px 12px 16px; cursor: pointer; display: flex; flex-direction: column; }
        .card-header:active { background: #f9f9f9; }
        
        .card-top-row { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        .battery-info-col { display: flex; flex-direction: column; align-items: flex-start; }
        .battery-name { font-weight: 600; font-size: 16px; margin-bottom: 6px; }
        
        .badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .spec-badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: var(--bg); color: var(--text-light); font-weight: 600; }
        .cycle-badge { background: var(--bg); color: var(--text-bold); padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; white-space: nowrap; }
        
        .card-bottom-row { width: 100%; text-align: center; margin-top: 8px; height: 12px; }
        .chevron { border: solid #c7c7cc; border-width: 0 2px 2px 0; display: inline-block; padding: 4px; transform: rotate(45deg); transition: transform 0.2s ease; }
        .chevron.open { transform: rotate(-135deg); margin-top: 4px; }
        
        .card-details { display: none; padding: 0 16px 16px 16px; }
        textarea { width: 100%; background: var(--input-bg); color: var(--text-bold); border: 1px solid transparent; border-radius: 8px; padding: 12px; font-family: 'Inter', sans-serif; font-size: 14px; box-sizing: border-box; resize: vertical; min-height: 80px; margin-top: 8px; }
        textarea:focus { outline: none; border-color: #c7c7cc; }
        
        .action-row { display: flex; gap: 10px; margin-top: 12px; }
        .btn-small { padding: 10px; font-size: 14px; margin-top: 0; flex: 1; }
        .btn-edit { background: var(--bg); color: var(--text-bold); }
        .btn-danger-solid { background: var(--danger); color: #fff; }
        
        #modal-overlay, #custom-dialog-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 200; align-items: flex-start; justify-content: center; padding: 10vh 20px 20px 20px; box-sizing: border-box; overflow-y: auto; }
        .modal-content { background: var(--surface); padding: 24px; border-radius: var(--radius); width: 100%; max-width: 400px; text-align: center; margin-bottom: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        input, select { width: 100%; padding: 14px; margin-top: 12px; background: var(--input-bg); color: var(--text-bold); border: 1px solid transparent; border-radius: 8px; font-size: 16px; font-family: 'Inter', sans-serif; box-sizing: border-box; transition: border-color 0.2s; }
        input.error, select.error { border-color: var(--danger); }
        input:focus, select:focus { outline: none; border-color: #c7c7cc; }
        
        select { appearance: none; -webkit-appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238e8e93%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 14px top 50%; background-size: 12px auto; padding-right: 40px; }
        
        .form-row { display: flex; gap: 10px; }
        .form-row select, .form-row input { flex: 1; }
        
        #delete-dialog { display: none; }
    </style>
</head>
<body>

    <div id="dashboard-view">
        <div class="brand-header">Battery Cache</div>
        <div id="list-container"></div>
        <div class="fab-container"><button class="fab" onclick="openScanner()">Scan Label</button></div>
    </div>

    <div id="scanner-view">
        <h2 style="text-align: center; margin-bottom: 20px;">Scanning...</h2>
        <div id="reader-container" onclick="prodAutofocus()">
            <div id="reader"></div>
            <div class="scanner-hint">Hold 10-15cm away • Tap to focus</div>
        </div>
        <button class="secondary" onclick="closeScanner()">Cancel</button>
    </div>

    <div id="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title">Register Battery</h3>
            <p id="scanned-id" style="font-size: 12px; color: var(--text-light); margin-bottom: 8px;"></p>
            
            <div id="new-battery-form">
                <input type="text" id="battery-name" placeholder="Name (e.g. Tattu R-Line)" oninput="this.classList.remove('error')">
                
                <div class="form-row">
                    <select id="battery-cells">
                        <option value="1S">1S</option>
                        <option value="2S">2S</option>
                        <option value="3S">3S</option>
                        <option value="4S" selected>4S</option>
                        <option value="6S">6S</option>
                        <option value="8S">8S</option>
                    </select>
                    <select id="battery-type">
                        <option value="LiPo">LiPo</option>
                        <option value="LiHV">LiHV</option>
                        <option value="LiUHV">LiUHV</option>
                        <option value="Li-ion">Li-ion</option>
                    </select>
                </div>
                
                <div class="form-row">
                    <input type="number" id="battery-capacity" placeholder="Capacity (mAh)" oninput="this.classList.remove('error')">
                    <input type="number" id="battery-cycles-input" placeholder="Cycles" min="0" oninput="this.classList.remove('error')">
                </div>

                <button onclick="saveBatteryDetails()" style="margin-top: 16px;">Save Battery</button>
            </div>

            <div id="existing-battery-actions">
                <h2 id="display-name" style="margin-bottom: 8px;"></h2>
                <p style="color: var(--text-light);">Cycles: <strong id="display-cycles" style="font-size: 28px; color: var(--text-bold);">0</strong></p>
                <button onclick="addCycle()" style="margin-bottom: 12px;">+ Add 1 Charge Cycle</button>
            </div>
            
            <button class="secondary" style="margin-top: 12px;" onclick="closeModal()">Close</button>
        </div>
    </div>

    <div id="custom-dialog-overlay">
        <div id="delete-dialog" class="modal-content">
            <h3 style="margin-bottom: 8px;">Delete Battery</h3>
            <p style="font-size: 14px; color: var(--text-light); margin-bottom: 20px;">Are you sure you want to remove this battery from your cache?</p>
            <div class="action-row">
                <button class="secondary btn-small" onclick="closeDeleteDialog()">Cancel</button>
                <button class="danger btn-small" onclick="confirmDelete()">Remove</button>
            </div>
        </div>
    </div>

    <script>
        let batteryDb = JSON.parse(localStorage.getItem('fpvBatteries')) || {};
        let currentScannedId = null;
        let editingBatteryId = null; 
        let pendingDeleteId = null; 
        let html5QrCode = null;

        async function prodAutofocus() {
            try {
                const videoElement = document.querySelector('#reader video');
                if (videoElement && videoElement.srcObject) {
                    const track = videoElement.srcObject.getVideoTracks()[0];
                    await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
                }
            } catch (error) {}
        }

        function openScanner() {
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('scanner-view').style.display = 'block';
            
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 15, qrbox: { width: 280, height: 200 } },
                (decodedText) => {
                    closeScanner(); 
                    handleScanResult(decodedText);
                }
            ).catch(err => {
                alert("Camera access denied.");
                closeScanner();
            });
            setTimeout(prodAutofocus, 1500);
        }

        function closeScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(resetViews).catch(resetViews);
            } else {
                resetViews();
            }
        }
        
        function resetViews() {
            document.getElementById('scanner-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
        }

        function handleScanResult(decodedText) {
            currentScannedId = decodedText;
            editingBatteryId = null; 
            
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('scanned-id').innerText = "ID: " + decodedText;
            document.getElementById('modal-title').innerText = "Register Battery";

            if (batteryDb[currentScannedId]) {
                document.getElementById('new-battery-form').style.display = 'none';
                document.getElementById('existing-battery-actions').style.display = 'block';
                document.getElementById('display-name').innerText = batteryDb[currentScannedId].name;
                document.getElementById('display-cycles').innerText = batteryDb[currentScannedId].cycles;
            } else {
                document.getElementById('existing-battery-actions').style.display = 'none';
                document.getElementById('new-battery-form').style.display = 'block';
                
                const nameInput = document.getElementById('battery-name');
                const capInput = document.getElementById('battery-capacity');
                const cyclesInput = document.getElementById('battery-cycles-input');
                
                nameInput.value = '';
                capInput.value = '';
                cyclesInput.value = '';
                
                nameInput.classList.remove('error');
                capInput.classList.remove('error');
                cyclesInput.classList.remove('error');
            }
        }

        function triggerEdit(id) {
            editingBatteryId = id;
            const bat = batteryDb[id];
            
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('scanned-id').innerText = "ID: " + id;
            document.getElementById('modal-title').innerText = "Edit Battery Specs";
            
            document.getElementById('existing-battery-actions').style.display = 'none';
            document.getElementById('new-battery-form').style.display = 'block';
            
            const nameInput = document.getElementById('battery-name');
            const capInput = document.getElementById('battery-capacity');
            const cyclesInput = document.getElementById('battery-cycles-input');
            
            nameInput.value = bat.name;
            document.getElementById('battery-cells').value = bat.cells || '4S';
            document.getElementById('battery-type').value = bat.type || 'LiPo';
            
            let rawCap = bat.capacity ? bat.capacity.replace('mAh', '') : '';
            capInput.value = rawCap === 'N/A' ? '' : rawCap;
            cyclesInput.value = bat.cycles !== undefined ? bat.cycles : '';
            
            nameInput.classList.remove('error');
            capInput.classList.remove('error');
            cyclesInput.classList.remove('error');
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            currentScannedId = null;
            editingBatteryId = null;
        }

        function saveBatteryDetails() {
            const nameInput = document.getElementById('battery-name');
            const capInput = document.getElementById('battery-capacity');
            const cyclesInput = document.getElementById('battery-cycles-input');
            const cells = document.getElementById('battery-cells').value;
            const type = document.getElementById('battery-type').value;
            
            let isValid = true;
            if (!nameInput.value.trim()) { nameInput.classList.add('error'); isValid = false; }
            if (!capInput.value.trim()) { capInput.classList.add('error'); isValid = false; }
            if (cyclesInput.value === '' || parseInt(cyclesInput.value) < 0) { cyclesInput.classList.add('error'); isValid = false; }
            if (!isValid) return;
            
            const targetId = editingBatteryId || currentScannedId;
            const cycleCount = parseInt(cyclesInput.value);
            
            if (editingBatteryId) {
                batteryDb[targetId].name = nameInput.value.trim();
                batteryDb[targetId].cells = cells;
                batteryDb[targetId].type = type;
                batteryDb[targetId].capacity = capInput.value.trim() + 'mAh';
                batteryDb[targetId].cycles = cycleCount;
                closeModal();
            } else {
                batteryDb[targetId] = { 
                    name: nameInput.value.trim(), 
                    cells: cells,
                    type: type,
                    capacity: capInput.value.trim() + 'mAh',
                    cycles: cycleCount, 
                    notes: "" 
                };
                handleScanResult(targetId); 
            }
            
            saveAndRefresh();
        }

        function addCycle() {
            batteryDb[currentScannedId].cycles += 1;
            saveAndRefresh();
            handleScanResult(currentScannedId); 
        }

        function toggleCard(id) {
            const detailsDiv = document.getElementById(`details-${id}`);
            const chevron = document.getElementById(`chevron-${id}`);
            
            if (detailsDiv.style.display === 'block') {
                detailsDiv.style.display = 'none';
                chevron.classList.remove('open');
            } else {
                detailsDiv.style.display = 'block';
                chevron.classList.add('open');
            }
        }

        function saveNote(id, text) {
            batteryDb[id].notes = text;
            localStorage.setItem('fpvBatteries', JSON.stringify(batteryDb));
        }

        function closeDeleteDialog() {
            document.getElementById('custom-dialog-overlay').style.display = 'none';
            document.getElementById('delete-dialog').style.display = 'none';
            pendingDeleteId = null;
        }

        function triggerDelete(id) {
            pendingDeleteId = id;
            document.getElementById('custom-dialog-overlay').style.display = 'flex';
            document.getElementById('delete-dialog').style.display = 'block';
        }

        function confirmDelete() {
            delete batteryDb[pendingDeleteId];
            saveAndRefresh();
            closeDeleteDialog();
        }

        function saveAndRefresh() {
            localStorage.setItem('fpvBatteries', JSON.stringify(batteryDb));
            renderList();
        }

        function renderList() {
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            
            const entries = Object.entries(batteryDb);
            if(entries.length === 0) {
                container.innerHTML = '<p style="color: var(--text-light); text-align: center; margin-top: 40px;">No batteries scanned yet.</p>';
                return;
            }

            for (const [id, bat] of entries) {
                const noteText = bat.notes || "";
                
                const badgeHtml = (bat.cells || bat.type || bat.capacity) ? `
                    <div class="badge-row">
                        ${bat.cells ? `<span class="spec-badge">${bat.cells}</span>` : ''}
                        ${bat.type ? `<span class="spec-badge">${bat.type}</span>` : ''}
                        ${bat.capacity && bat.capacity !== 'N/A' ? `<span class="spec-badge">${bat.capacity}</span>` : ''}
                    </div>
                ` : '';

                container.innerHTML += `
                    <div class="battery-card">
                        <div class="card-header" onclick="toggleCard('${id}')">
                            <div class="card-top-row">
                                <div class="
