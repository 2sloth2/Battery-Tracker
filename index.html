<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPV Battery Tracker</title>
    <!-- We are pulling in a free library to handle the camera QR scanning -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root { --bg: #121212; --surface: #1e1e1e; --primary: #03dac6; --text: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; text-align: center; }
        h2 { color: var(--primary); }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border: 2px solid var(--primary); border-radius: 10px; overflow: hidden; background: black; }
        .card { background: var(--surface); padding: 20px; border-radius: 10px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button { background: var(--primary); color: #000; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; }
        button:active { opacity: 0.8; }
        input { width: 90%; padding: 10px; margin-top: 10px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; font-size: 16px; }
        #battery-list { text-align: left; margin-top: 30px; }
        .battery-item { background: var(--surface); padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .cycle-badge { background: var(--primary); color: #000; padding: 5px 10px; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🔋 FPV Cycle Tracker</h2>
    
    <!-- Camera Viewport -->
    <div id="reader"></div>

    <!-- Interface that pops up after scanning -->
    <div id="action-area" class="card" style="display: none;">
        <h3 id="status-title">QR Scanned!</h3>
        <p id="scanned-id" style="font-size: 12px; color: #888;"></p>
        
        <div id="new-battery-form" style="display: none;">
            <p>New Battery Detected. Give it a name (e.g., Tattu 850 #1)</p>
            <input type="text" id="battery-name" placeholder="Enter battery name...">
            <button onclick="registerNewBattery()">Save Battery</button>
        </div>

        <div id="existing-battery-actions" style="display: none;">
            <h2 id="display-name" style="margin:0;"></h2>
            <p>Current Cycles: <strong id="display-cycles" style="font-size: 24px; color: var(--primary);">0</strong></p>
            <button onclick="addCycle()">➕ Add 1 Charge Cycle</button>
        </div>
    </div>

    <!-- List of all your batteries -->
    <div id="battery-list">
        <h3 style="border-bottom: 1px solid #333; padding-bottom: 10px;">My Hangar</h3>
        <div id="list-container"></div>
    </div>

    <script>
        // Use local storage to save data permanently on the phone
        let batteryDb = JSON.parse(localStorage.getItem('fpvBatteries')) || {};
        let currentScannedId = null;

        // Initialize the QR Scanner using the HTML5-QRCode library
const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
    fps: 10, 
    qrbox: {width: 250, height: 250},
    showZoomSliderIfSupported: true,
    defaultZoomValueIfSupported: 2
}, /* verbose= */ false);

        function onScanSuccess(decodedText, decodedResult) {
            currentScannedId = decodedText;
            document.getElementById('action-area').style.display = 'block';
            document.getElementById('scanned-id').innerText = "ID: " + decodedText;

            // Check if we already have this battery saved
            if (batteryDb[currentScannedId]) {
                document.getElementById('new-battery-form').style.display = 'none';
                document.getElementById('existing-battery-actions').style.display = 'block';
                document.getElementById('display-name').innerText = batteryDb[currentScannedId].name;
                document.getElementById('display-cycles').innerText = batteryDb[currentScannedId].cycles;
            } else {
                document.getElementById('existing-battery-actions').style.display = 'none';
                document.getElementById('new-battery-form').style.display = 'block';
                document.getElementById('battery-name').value = '';
            }
        }

        function onScanFailure(error) {
            // Fails constantly while searching for a QR code, so we keep this quiet.
        }

        function registerNewBattery() {
            const name = document.getElementById('battery-name').value;
            if (!name) return alert("Please enter a name!");
            
            batteryDb[currentScannedId] = { name: name, cycles: 0 };
            saveAndRefresh();
            onScanSuccess(currentScannedId); // Reload view
        }

        function addCycle() {
            batteryDb[currentScannedId].cycles += 1;
            saveAndRefresh();
            onScanSuccess(currentScannedId); // Update the big number
        }

        function saveAndRefresh() {
            localStorage.setItem('fpvBatteries', JSON.stringify(batteryDb));
            renderList();
        }

        function renderList() {
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            for (const id in batteryDb) {
                const bat = batteryDb[id];
                container.innerHTML += `
                    <div class="battery-item">
                        <span>${bat.name}</span>
                        <span class="cycle-badge">${bat.cycles} Cycles</span>
                    </div>
                `;
            }
        }

        // Render the list on startup
        renderList();
    </script>
</body>
</html>
