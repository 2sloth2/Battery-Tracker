<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f5f5f7">
    
    <link rel="manifest" href="manifest.json">
    
    <title>FPV Battery Vault</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #f5f5f7; 
            --surface: #ffffff; 
            --text-bold: #1d1d1f; 
            --text-light: #515154; 
            --brand: #151136; 
            --brand-light: #e5e4ef;
            --primary-text: #ffffff;
            --danger: #7a121f; 
            --input-bg: #f5f5f7;
            --border-light: #e5e5ea;
            --radius: 16px; 
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-bold); margin: 0; padding: 20px; padding-bottom: 150px; -webkit-tap-highlight-color: transparent; }
        
        .brand-header {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 24px;
            color: var(--brand);
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h2, h3, strong { font-weight: 600; margin-top: 0; letter-spacing: -0.3px; }
        
        #scanner-view, #modal-overlay, #custom-dialog-overlay, #info-dialog-overlay { display: none; }
        
        button { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; border-radius: var(--radius); cursor: pointer; width: 100%; transition: opacity 0.2s; border: none; padding: 14px 20px; box-shadow: none; }
        button:active { opacity: 0.7; }
        
        .fab-container { position: fixed; bottom: 20px; left: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 12px; }
        .fab { background: var(--brand); color: var(--primary-text); font-size: 18px; padding: 18px; }
        .fab-secondary { background: var(--surface); color: var(--text-bold); font-size: 18px; padding: 18px; border: 1px solid var(--border-light); }

        /* Filter Bar */
        .filter-bar { display: flex; gap: 10px; margin-bottom: 16px; }
        .filter-select { flex: 1; padding: 10px 32px 10px 12px; background: var(--surface); color: var(--text-bold); border: 1px solid var(--border-light); border-radius: 10px; font-size: 14px; font-family: 'Inter', sans-serif; font-weight: 600; appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238e8e93%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 10px top 50%; background-size: 10px auto; transition: all 0.2s ease; outline: none; box-shadow: none; }
        .filter-select.active-filter { border-color: var(--brand); color: var(--brand); background-color: var(--brand-light); }

        #reader-container { position: relative; width: 100%; border-radius: var(--radius); overflow: hidden; background: #000; margin-bottom: 20px; }
        #reader { width: 100%; }
        
        .battery-card { background: var(--surface); border-radius: var(--radius); margin-bottom: 12px; border: 1px solid var(--border-light); box-shadow: none; overflow: hidden; }
        .card-header { padding: 16px; cursor: pointer; display: flex; flex-direction: column; }
        .card-header:active { background: #f9f9f9; }
        
        /* Flexbox Alignment Container for Title and Info Icon */
        .card-header-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; gap: 12px; }
        
        .battery-header-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; }
        .battery-name { font-weight: 600; font-size: 16px; margin: 0; line-height: 20px; }
        
        .info-icon { color: #c7c7cc; display: flex; align-items: center; justify-content: center; height: 20px; width: 20px; flex-shrink: 0; transition: color 0.2s; }
        .info-icon:active { color: var(--text-bold); }
        
        .badge-row { display: flex; gap: 4px; flex-wrap: wrap; }
        .spec-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--bg); color: var(--text-light); font-weight: 600; }
        
        .card-middle-row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; width: 100%; }
        .cycle-text { font-size: 16px; color: var(--text-bold); }
        .cycle-text strong { font-size: 18px; }
        .cycle-btn { background: var(--brand); color: var(--primary-text); padding: 10px 20px; font-size: 15px; border-radius: 10px; width: auto; }
        
        .card-bottom-row { width: 100%; text-align: center; margin-top: 8px; height: 12px; }
        .chevron { border: solid #c7c7cc; border-width: 0 2px 2px 0; display: inline-block; padding: 4px; transform: rotate(45deg); transition: transform 0.2s ease; }
        .chevron.open { transform: rotate(-135deg); margin-top: 4px; }
        
        .card-details { display: none; padding: 0 16px 16px 16px; }
        .section-label { font-size: 12px; font-weight: 600; color: var(--text-light); text-transform: uppercase; margin-bottom: 4px; display: block; letter-spacing: 0.5px; }
        textarea { width: 100%; background: var(--input-bg); color: var(--text-bold); border: 1px solid transparent; border-radius: 8px; padding: 12px; font-family: 'Inter', sans-serif; font-size: 14px; box-sizing: border-box; resize: vertical; min-height: 80px; margin-top: 4px; }
        textarea:focus { outline: none; border-color: #c7c7cc; }
        
        .card-actions { display: flex; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-light); }
        .btn-small { padding: 12px 10px; font-size: 14px; margin-top: 0; flex: 1; border-radius: 8px; }
        .btn-neutral { background: var(--border-light); color: var(--text-bold); }
        .btn-danger-solid { background: var(--danger); color: #fff; }
        
        .secondary { background: var(--border-light); color: var(--text-bold); }
        
        #modal-overlay, #custom-dialog-overlay, #info-dialog-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); 
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 200; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        
        .modal-content { position: relative; background: var(--surface); padding: 24px; border-radius: var(--radius); width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--border-light); box-shadow: 0 10px 40px rgba(0,0,0,0.15); }
        
        .close-x { position: absolute; top: 16px; right: 16px; color: #c7c7cc; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; transition: color 0.2s;}
        .close-x:active { color: var(--text-bold); }

        input, select { width: 100%; padding: 14px; margin-top: 12px; background: var(--input-bg); color: var(--text-bold); border: 1px solid transparent; border-radius: 8px; font-size: 16px; font-family: 'Inter', sans-serif; box-sizing: border-box; transition: border-color 0.2s; box-shadow: none; }
        input.error, select.error { border-color: var(--danger); border-width: 1px; }
        input:focus, select:focus { outline: none; border-color: #c7c7cc; border-width: 1px; }
        
        .form-row { display: flex; gap: 10px; }
        .form-row select, .form-row input { flex: 1; }

        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-light); text-align: left; }
        .info-row:last-of-type { border-bottom: none; }
        .info-label { font-size: 14px; color: var(--text-light); font-weight: 600; }
        .info-value { font-size: 14px; color: var(--text-bold); font-family: monospace; }
    </style>
</head>
<body>

    <div id="dashboard-view">
        <div class="brand-header">Battery Vault</div>
        
        <div class="filter-bar">
            <select id="filter-cells" class="filter-select" onchange="applyFilters()">
                <option value="All">All Cellcounts</option>
                <option value="1S">1S Packs</option>
                <option value="2S">2S Packs</option>
                <option value="3S">3S Packs</option>
                <option value="4S">4S Packs</option>
                <option value="6S">6S Packs</option>
                <option value="8S">8S Packs</option>
            </select>
            <select id="filter-type" class="filter-select" onchange="applyFilters()">
                <option value="All">All Chemistries</option>
                <option value="LiPo">LiPo</option>
                <option value="LiHV">LiHV</option>
                <option value="LiUHV">LiUHV</option>
                <option value="Li-ion">Li-ion</option>
            </select>
        </div>

        <div id="list-container"></div>
        
        <div class="fab-container">
            <button class="fab" onclick="openScanner()">Scan Label</button>
            <button class="fab-secondary" onclick="openManualAdd()">Add Manually</button>
        </div>
    </div>

    <div id="scanner-view">
        <h2 style="text-align: center; margin-bottom: 20px;">Scanning...</h2>
        <div id="reader-container" onclick="prodAutofocus()">
            <div id="reader"></div>
        </div>
        <button class="secondary" onclick="closeScanner()">Cancel</button>
    </div>

    <!-- Main Add/Edit/Recognized Modal -->
    <div id="modal-overlay">
        <div class="modal-content" style="padding-top: 32px;">
            <div class="close-x" onclick="closeModal()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </div>
            
            <h3 id="modal-title" style="margin-top: 0; margin-bottom: 16px;">Register Battery</h3>
            <p id="scanned-id" style="font-size: 12px; color: var(--text-light); margin-bottom: 12px; display: none;"></p>
            
            <!-- Standard Form View -->
            <div id="new-battery-form">
                <input type="text" id="battery-name" placeholder="Name (e.g. Tattu R-Line)" oninput="this.classList.remove('error')">
                
                <div class="form-row">
                    <select id="battery-cells">
                        <option value="1S">1S</option>
                        <option value="2S">2S</option>
                        <option value="3S">3S</option>
                        <option value="4S" selected>4S</option>
                        <option value="6S">6S</option>
                        <option value="8S">8S</option>
                    </select>
                    <select id="battery-type">
                        <option value="LiPo">LiPo</option>
                        <option value="LiHV">LiHV</option>
                        <option value="LiUHV">LiUHV</option>
                        <option value="Li-ion">Li-ion</option>
                    </select>
                </div>
                
                <div class="form-row">
                    <input type="number" id="battery-capacity" placeholder="Capacity (mAh)" oninput="this.classList.remove('error')">
                    <input type="number" id="battery-cycles-input" placeholder="Cycles" min="0" oninput="this.classList.remove('error')">
                </div>

                <button onclick="saveBatteryDetails()" style="background: var(--brand); color: #fff; margin-top: 16px;">Save Battery</button>
            </div>

            <!-- Recognized Scan View -->
            <div id="existing-battery-actions" style="display: none;">
                <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; margin-top: 8px; flex-wrap: wrap;">
                    <h2 id="display-name" style="margin: 0; font-size: 20px;"></h2>
                    <div class="badge-row" id="display-badges"></div>
                </div>
                
                <p style="color: var(--text-light); margin-bottom: 24px;">Current Cycles: <strong id="display-cycles" style="font-size: 36px; color: var(--brand); display: block; margin-top: 8px;">0</strong></p>
                
                <button onclick="addCycleFromScan()" style="background: var(--brand); color: #fff; margin-bottom: 12px;">+1 Cycle</button>
                <button class="secondary" onclick="triggerEdit(currentScannedId)">Edit</button>
            </div>
            
        </div>
    </div>

    <!-- Custom Delete Dialog -->
    <div id="custom-dialog-overlay">
        <div id="delete-dialog" class="modal-content">
            <h3 style="margin-bottom: 8px; margin-top: 0;">Delete Battery</h3>
            <p style="font-size: 14px; color: var(--text-light); margin-bottom: 20px;">Are you sure you want to remove this battery from your vault?</p>
            <div class="card-actions" style="margin-top: 0; padding-top: 0; border: none;">
                <button class="btn-small btn-neutral" onclick="closeDeleteDialog()">Cancel</button>
                <button class="btn-small btn-danger-solid" onclick="confirmDelete()">Remove</button>
            </div>
        </div>
    </div>

    <!-- Battery Info Popup -->
    <div id="info-dialog-overlay">
        <div class="modal-content" style="padding-top: 32px;">
            <div class="close-x" onclick="closeInfoDialog()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </div>
            <h3 style="margin-bottom: 20px; margin-top: 0;">Battery Info</h3>
            
            <div class="info-row">
                <span class="info-label">Battery ID</span>
                <span class="info-value" id="info-val-id">---</span>
            </div>
            <div class="info-row">
                <span class="info-label">Date Added</span>
                <span class="info-value" style="font-family: 'Inter', sans-serif;" id="info-val-date">---</span>
            </div>
        </div>
    </div>

    <script>
        let batteryDb = JSON.parse(localStorage.getItem('fpvBatteries')) || {};
        
        if (typeof batteryDb !== 'object' || Array.isArray(batteryDb) || batteryDb === null) {
            batteryDb = {};
        }

        let currentScannedId = null;
        let editingBatteryId = null; 
        let pendingDeleteId = null; 
        let html5QrCode = null;
        
        let filterCellState = 'All';
        let filterTypeState = 'All';

        function generateManualId(name) {
            const cleanName = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
            const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            const randomSuffix = Math.random().toString(36).substr(2, 4);
            return `manual_${cleanName}_${dateStr}_${randomSuffix}`;
        }
        
        function getTodayString() {
            return new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }

        async function prodAutofocus() {
            try {
                const videoElement = document.querySelector('#reader video');
                if (videoElement && videoElement.srcObject) {
                    const track = videoElement.srcObject.getVideoTracks()[0];
                    await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
                }
            } catch (error) {}
        }

        function applyFilters() {
            const cellSelect = document.getElementById('filter-cells');
            const typeSelect = document.getElementById('filter-type');
            
            filterCellState = cellSelect.value;
            filterTypeState = typeSelect.value;
            
            if (filterCellState !== 'All') cellSelect.classList.add('active-filter');
            else cellSelect.classList.remove('active-filter');
            
            if (filterTypeState !== 'All') typeSelect.classList.add('active-filter');
            else typeSelect.classList.remove('active-filter');
            
            renderList();
        }

        function openManualAdd() {
            currentScannedId = null; 
            editingBatteryId = null; 
            
            document.getElementById('modal-overlay').style.display = 'flex';
            
            // Hide the ID completely for manual additions
            document.getElementById('scanned-id').style.display = 'none';
            
            document.getElementById('modal-title').innerText = "Add Battery Manually";
            document.getElementById('modal-title').style.display = 'block';
            
            document.getElementById('existing-battery-actions').style.display = 'none';
            document.getElementById('new-battery-form').style.display = 'block';
            
            const nameInput = document.getElementById('battery-name');
            const capInput = document.getElementById('battery-capacity');
            const cyclesInput = document.getElementById('battery-cycles-input');
            
            nameInput.value = '';
            capInput.value = '';
            cyclesInput.value = '';
            
            nameInput.classList.remove('error');
            capInput.classList.remove('error');
            cyclesInput.classList.remove('error');
        }

        function openScanner() {
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('scanner-view').style.display = 'block';
            
            try {
                if (html5QrCode) {
                    html5QrCode.clear();
                }
            } catch(e) {}
            
            html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 15, qrbox: { width: 280, height: 200 } },
                (decodedText) => {
                    closeScanner(); 
                    handleScanResult(decodedText);
                },
                (errorMessage) => {}
            ).then(() => {
                setTimeout(prodAutofocus, 1500);
            }).catch(err => {
                alert("Camera access denied or failed.");
                closeScanner();
            });
        }

        function closeScanner() {
            if (html5QrCode) {
                try {
                    html5QrCode.stop().then(() => {
                        html5QrCode.clear();
                        resetViews();
                    }).catch(() => {
                        resetViews();
                    });
                } catch(e) {
                    resetViews();
                }
            } else {
                resetViews();
            }
        }
        
        function resetViews() {
            document.getElementById('scanner-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
        }

        function handleScanResult(decodedText) {
            currentScannedId = decodedText;
            editingBatteryId = null; 
            
            if (batteryDb[currentScannedId]) {
                const bat = batteryDb[currentScannedId];
                
                document.getElementById('modal-overlay').style.display = 'flex';
                document.getElementById('scanned-id').style.display = 'none';
                document.getElementById('modal-title').style.display = 'none';
                
                document.getElementById('new-battery-form').style.display = 'none';
                document.getElementById('existing-battery-actions').style.display = 'block';
                
                document.getElementById('display-name').innerText = bat.name || "Unknown";
                document.getElementById('display-cycles').innerText = bat.cycles || 0;
                
                let badgeHtml = '';
                if (bat.cells) badgeHtml += `<span class="spec-badge">${bat.cells}</span>`;
                if (bat.type) badgeHtml += `<span class="spec-badge">${bat.type}</span>`;
                if (bat.capacity && bat.capacity !== 'N/A') badgeHtml += `<span class="spec-badge">${bat.capacity}</span>`;
                document.getElementById('display-badges').innerHTML = badgeHtml;
                
            } else {
                document.getElementById('modal-overlay').style.display = 'flex';
                document.getElementById('scanned-id').innerText = "ID: " + decodedText;
                document.getElementById('scanned-id').style.display = 'block';
                
                document.getElementById('modal-title').innerText = "Register Battery";
                document.getElementById('modal-title').style.display = 'block';
                
                document.getElementById('existing-battery-actions').style.display = 'none';
                document.getElementById('new-battery-form').style.display = 'block';
                
                const nameInput = document.getElementById('battery-name');
                const capInput = document.getElementById('battery-capacity');
                const cyclesInput = document.getElementById('battery-cycles-input');
                
                nameInput.value = '';
                capInput.value = '';
                cyclesInput.value = '';
                
                nameInput.classList.remove('error');
                capInput.classList.remove('error');
                cyclesInput.classList.remove('error');
            }
        }
        
        function addCycleFromScan() {
            if (currentScannedId && batteryDb[currentScannedId]) {
                batteryDb[currentScannedId].cycles = (batteryDb[currentScannedId].cycles || 0) + 1;
                document.getElementById('display-cycles').innerText = batteryDb[currentScannedId].cycles;
                saveAndRefresh();
            }
        }

        function triggerEdit(id) {
            editingBatteryId = id;
            const bat = batteryDb[id];
            if (!bat) return;
            
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('scanned-id').innerText = "ID: " + id;
            document.getElementById('scanned-id').style.display = 'block';
            
            document.getElementById('modal-title').innerText = "Edit Battery Specs";
            document.getElementById('modal-title').style.display = 'block';
            
            document.getElementById('existing-battery-actions').style.display = 'none';
            document.getElementById('new-battery-form').style.display = 'block';
            
            const nameInput = document.getElementById('battery-name');
            const capInput = document.getElementById('battery-capacity');
            const cyclesInput = document.getElementById('battery-cycles-input');
            
            nameInput.value = bat.name || "";
            document.getElementById('battery-cells').value = bat.cells || '4S';
            document.getElementById('battery-type').value = bat.type || 'LiPo';
            
            let rawCap = bat.capacity ? bat.capacity.replace('mAh', '') : '';
            capInput.value = rawCap === 'N/A' ? '' : rawCap;
            cyclesInput.value = bat.cycles !== undefined ? bat.cycles : '';
            
            nameInput.classList.remove('error');
            capInput.classList.remove('error');
            cyclesInput.classList.remove('error');
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            currentScannedId = null;
            editingBatteryId = null;
        }

        function saveBatteryDetails() {
            const nameInput = document.getElementById('battery-name');
            const capInput = document.getElementById('battery-capacity');
            const cyclesInput = document.getElementById('battery-cycles-input');
            const cells = document.getElementById('battery-cells').value;
            const type = document.getElementById('battery-type').value;
            
            let isValid = true;
            if (!nameInput.value.trim()) { nameInput.classList.add('error'); isValid = false; }
            if (!capInput.value.trim()) { capInput.classList.add('error'); isValid = false; }
            if (cyclesInput.value === '' || parseInt(cyclesInput.value) < 0) { cyclesInput.classList.add('error'); isValid = false; }
            if (!isValid) return;
            
            const cycleCount = parseInt(cyclesInput.value);
            const trimmedName = nameInput.value.trim();

            if (editingBatteryId) {
                const existingDate = (batteryDb[editingBatteryId] && batteryDb[editingBatteryId].dateAdded) ? batteryDb[editingBatteryId].dateAdded : getTodayString();
                
                batteryDb[editingBatteryId].name = trimmedName;
                batteryDb[editingBatteryId].cells = cells;
                batteryDb[editingBatteryId].type = type;
                batteryDb[editingBatteryId].capacity = capInput.value.trim() + 'mAh';
                batteryDb[editingBatteryId].cycles = cycleCount;
                batteryDb[editingBatteryId].dateAdded = existingDate;
            } else {
                let targetId = currentScannedId;
                if (!targetId) {
                    targetId = generateManualId(trimmedName);
                }
                
                batteryDb[targetId] = { 
                    name: trimmedName, 
                    cells: cells,
                    type: type,
                    capacity: capInput.value.trim() + 'mAh',
                    cycles: cycleCount, 
                    notes: "",
                    dateAdded: getTodayString()
                };
            }
            
            saveAndRefresh();
            closeModal();
        }

        function addCycleToId(event, id) {
            if (event) event.stopPropagation();
            if(batteryDb[id]) {
                batteryDb[id].cycles = (batteryDb[id].cycles || 0) + 1;
                saveAndRefresh();
            }
        }

        function toggleCard(id) {
            const detailsDiv = document.getElementById(`details-${id}`);
            const chevron = document.getElementById(`chevron-${id}`);
            
            if (detailsDiv.style.display === 'block') {
                detailsDiv.style.display = 'none';
                chevron.classList.remove('open');
            } else {
                detailsDiv.style.display = 'block';
                chevron.classList.add('open');
            }
        }

        function saveNote(id, text) {
            if(batteryDb[id]) {
                batteryDb[id].notes = text;
                localStorage.setItem('fpvBatteries', JSON.stringify(batteryDb));
            }
        }

        function showInfoDialog(event, id) {
            if (event) event.stopPropagation();
            const bat = batteryDb[id];
            if (!bat) return;
            
            document.getElementById('info-val-id').innerText = id;
            document.getElementById('info-val-date').innerText = bat.dateAdded || "Unknown";
            
            document.getElementById('info-dialog-overlay').style.display = 'flex';
        }

        function closeInfoDialog() {
            document.getElementById('info-dialog-overlay').style.display = 'none';
        }

        function closeDeleteDialog() {
            document.getElementById('custom-dialog-overlay').style.display = 'none';
            document.getElementById('delete-dialog').style.display = 'none';
            pendingDeleteId = null;
        }

        function triggerDelete(id) {
            pendingDeleteId = id;
            document.getElementById('custom-dialog-overlay').style.display = 'flex';
            document.getElementById('delete-dialog').style.display = 'block';
        }

        function confirmDelete() {
            if(pendingDeleteId) {
                delete batteryDb[pendingDeleteId];
                saveAndRefresh();
            }
            closeDeleteDialog();
        }

        function saveAndRefresh() {
            localStorage.setItem('fpvBatteries', JSON.stringify(batteryDb));
            renderList();
        }

        function renderList() {
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            
            const entries = Object.entries(batteryDb);
            
            if(entries.length === 0) {
                container.innerHTML = '<p style="color: var(--text-light); text-align: center; margin-top: 40px;">No batteries in vault yet.</p>';
                return;
            }

            const filteredEntries = entries.filter(([id, bat]) => {
                if(!bat) return false;
                const matchCell = (filterCellState === 'All') || (bat.cells === filterCellState);
                const matchType = (filterTypeState === 'All') || (bat.type === filterTypeState);
                return matchCell && matchType;
            });

            if(filteredEntries.length === 0) {
                container.innerHTML = '<p style="color: var(--text-light); text-align: center; margin-top: 40px;">No batteries match your active filters.</p>';
                return;
            }

            for (const [id, bat] of filteredEntries) {
                const noteText = bat.notes || "";
                
                const safeId = String(id).replace(/'/g, "\\'");
                const safeName = bat.name || "Unknown";
                const safeCycles = bat.cycles || 0;
                
                let badgeHtml = '';
                if (bat.cells || bat.type || bat.capacity) {
                    badgeHtml += '<div class="badge-row">';
                    if (bat.cells) badgeHtml += `<span class="spec-badge">${bat.cells}</span>`;
                    if (bat.type) badgeHtml += `<span class="spec-badge">${bat.type}</span>`;
                    if (bat.capacity && bat.capacity !== 'N/A') badgeHtml += `<span class="spec-badge">${bat.capacity}</span>`;
                    badgeHtml += '</div>';
                }

                container.innerHTML += `
                    <div class="battery-card">
                        <div class="card-header" onclick="toggleCard('${safeId}')">
                            <div class="card-header-top">
                                <div class="battery-header-group">
                                    <span class="battery-name">${safeName}</span>
                                    ${badgeHtml}
                                </div>
                                <div class="info-icon" onclick="showInfoDialog(event, '${safeId}')">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <line x1="12" y1="16" x2="12" y2="12"></line>
                                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                                    </svg>
                                </div>
                            </div>
                            <div class="card-middle-row">
                                <span class="cycle-text"><strong>${safeCycles}</strong> Cycles</span>
                                <button class="cycle-btn" onclick="addCycleToId(event, '${safeId}')">+1 Cycle</button>
                            </div>
                            <div class="card-bottom-row">
                                <i class="chevron" id="chevron-${safeId}"></i>
                            </div>
                        </div>
                        <div class="card-details" id="details-${safeId}">
                            <span class="section-label">Notes</span>
                            <textarea placeholder="Log IR readings (e.g. 3.2mΩ), punch-out feel, or crash history here..." 
                                      oninput="saveNote('${safeId}', this.value)">${noteText}</textarea>
                            <div class="card-actions">
                                <button class="btn-small btn-neutral" onclick="triggerEdit('${safeId}')">Edit</button>
                                <button class="btn-small btn-danger-solid" onclick="triggerDelete('${safeId}')">Delete Battery</button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        renderList();
    </script>
</body>
</html>
